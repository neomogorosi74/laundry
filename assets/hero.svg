<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-label="A wash cycle finishing with shirts on hangers and a neatly folded stack">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5fc9"/>
      <stop offset="1" stop-color="#0e3272"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#dde8f9"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <ellipse cx="300" cy="562" rx="250" ry="26" fill="#0e3272" opacity="0.08"/>

  <!-- washing machine -->
  <rect x="70" y="200" width="270" height="330" rx="26" fill="url(#lg)"/>
  <rect x="70" y="200" width="270" height="330" rx="26" fill="none" stroke="#0e3272" stroke-width="3"/>
  <rect x="96" y="228" width="180" height="56" rx="14" fill="#0e3272" opacity="0.32"/>
  <circle cx="124" cy="256" r="11" fill="#7aa8e6"/>
  <rect x="152" y="248" width="76" height="16" rx="8" fill="#a3c0ea" opacity="0.7"/>
  <circle cx="205" cy="404" r="92" fill="#0e3272"/>
  <circle cx="205" cy="404" r="74" fill="#dde8f9"/>
  <g fill="none" stroke="#a3c0ea" stroke-width="4" stroke-linecap="round">
    <path d="M158 372c22 8 44 8 66 0"/>
    <path d="M162 398c20-8 40-8 60 0"/>
    <path d="M170 424c18-6 36-6 54 0"/>
  </g>
  <circle cx="228" cy="342" r="7" fill="#ffffff" opacity="0.9"/>
  <path d="M96 500h180" stroke="#7aa8e6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- rail with hangers -->
  <g stroke="#0e3272" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M370 96h230"/>
    <path d="M400 96v26M490 96v26M580 96v26"/>
    <path d="M400 122l-20 14 12 8v96h30v-96l12-8z" fill="url(#cloth)"/>
    <path d="M490 122l-20 14 12 8v96h30v-96l12-8z" fill="#cadcf5"/>
    <path d="M580 122l-20 14 12 8v96h30v-96l12-8z" fill="#e9f0fb"/>
  </g>

  <!-- folded stack -->
  <g stroke="#0e3272" stroke-width="3" stroke-linejoin="round">
    <path d="M350 470h190v40H350z" fill="#a3c0ea"/>
    <path d="M362 428h166v40H362z" fill="#cadcf5"/>
    <path d="M374 390h142v36H374z" fill="#dde8f9"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M396 408h26M430 408h30"/>
    <path d="M388 448h22M418 448h22M448 448h26"/>
    <path d="M380 490h24M412 490h24M444 490h24"/>
  </g>

  <!-- zip detail -->
  <g fill="none" stroke="#14479b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M556 250v250M578 250v250"/>
  </g>
  <g fill="#1a5fc9">
    <path d="M548 296h16v16h-16zM548 320h16v16h-16zM570 296h16v16h-16zM570 320h16v16h-16z"/>
    <path d="M542 348h36l-4 10c-1.6 3.6-4.4 5.6-8 5.6h-12c-3.6 0-6.4-2-8-5.6z"/>
  </g>
</svg>
