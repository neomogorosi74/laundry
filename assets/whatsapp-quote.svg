<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" role="img" aria-label="Illustration of a WhatsApp message asking for a laundry price with a reply confirming the collection is booked">
  <defs>
    <linearGradient id="wdm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25D366"/>
      <stop offset="1" stop-color="#1da851"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="140" rx="66" ry="7" fill="#1a5fc9" opacity=".10"/>

  <!-- phone body -->
  <rect x="58" y="12" width="84" height="128" rx="14" fill="#14479b"/>
  <rect x="63" y="17" width="74" height="118" rx="10" fill="#f2f6fc"/>

  <!-- chat header -->
  <rect x="63" y="17" width="74" height="20" rx="10" fill="url(#wdm)"/>
  <rect x="63" y="27" width="74" height="10" fill="url(#wdm)"/>
  <circle cx="74" cy="27" r="6" fill="#ffffff" opacity=".95"/>
  <rect x="84" y="23" width="26" height="4" rx="2" fill="#ffffff" opacity=".9"/>
  <rect x="84" y="30" width="16" height="3" rx="1.5" fill="#ffffff" opacity=".6"/>

  <!-- outgoing bubble -->
  <rect x="90" y="45" width="42" height="20" rx="9" fill="#d9fdd3"/>
  <rect x="96" y="52" width="30" height="3" rx="1.5" fill="#14479b" opacity=".55"/>
  <rect x="96" y="58" width="20" height="3" rx="1.5" fill="#14479b" opacity=".4"/>

  <!-- incoming bubble -->
  <rect x="69" y="71" width="48" height="26" rx="9" fill="#ffffff" stroke="#d8e4f7" stroke-width="1"/>
  <rect x="75" y="78" width="36" height="3" rx="1.5" fill="#14479b" opacity=".5"/>
  <rect x="75" y="84" width="28" height="3" rx="1.5" fill="#14479b" opacity=".4"/>
  <rect x="75" y="90" width="18" height="3" rx="1.5" fill="#14479b" opacity=".3"/>

  <!-- ticks -->
  <path d="M104 88l3 3 5-5" stroke="#25D366" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 88l3 3 5-5" stroke="#25D366" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>

  <!-- input bar -->
  <rect x="69" y="106" width="62" height="18" rx="9" fill="#ffffff" stroke="#d8e4f7" stroke-width="1"/>
  <circle cx="122" cy="115" r="6" fill="url(#wdm)"/>
  <path d="M120 115h4M122 113v4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- floating price tag -->
  <g transform="rotate(-8 40 52)">
    <path d="M24 40h24l10 12-10 12H24a6 6 0 0 1-6-6V46a6 6 0 0 1 6-6z" fill="#1a5fc9"/>
    <circle cx="26" cy="52" r="3" fill="#ffffff" opacity=".9"/>
    <path d="M36 48h12M36 56h8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- floating bag -->
  <g transform="translate(150 74)">
    <path d="M4 12h30l-3 26a5 5 0 0 1-5 4H12a5 5 0 0 1-5-4z" fill="#4f83cf"/>
    <path d="M12 12V8a7 7 0 0 1 14 0v4" stroke="#14479b" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="19" cy="26" r="6" fill="#ffffff" opacity=".55"/>
  </g>
</svg>
